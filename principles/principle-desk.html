<!DOCTYPE html>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的原则 · 原则管理台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3f5f9;--card:#ffffff;--line:#e6e9f0;
  --ink:#1f2937;--ink2:#6b7280;--ink3:#9ca3af;
  --blue:#2563eb;--blue-d:#1e40af;--blue-bg:#eff4ff;
  --red:#dc2626;--red-bg:#fef2f2;
  --green:#16a34a;--green-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
  --radius:14px;
}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.hide{display:none!important}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:var(--ink3)}

/* ===== 头部 ===== */
header{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.hd-inner{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hd-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hd-title{flex:1;min-width:0}
.hd-title h1{font-size:17px;font-weight:700}
.hd-title p{font-size:12px;color:var(--ink2)}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:999px;flex-shrink:0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-dot.sync{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.off{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== 主体 ===== */
main{max-width:960px;margin:0 auto;padding:14px 16px 30px}

/* ===== 今天要处理 ===== */
.due-card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.due-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-weight:700;font-size:15px}
.due-head .badge{margin-left:auto;background:var(--red-bg);color:var(--red);font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.due-list{padding:0 12px 12px}
.due-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:8px;background:var(--bg);border:1px solid var(--line)}
.due-item:last-child{margin-bottom:0}
.due-item.overdue{background:var(--red-bg);border-color:#fecaca}
.due-item.today{background:var(--blue-bg);border-color:#bfdbfe}
.due-item.soon{background:var(--amber-bg);border-color:#fde68a}
.due-tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;flex-shrink:0;background:var(--card);border:1px solid var(--line)}
.due-item.overdue .due-tag{color:var(--red);border-color:#fca5a5;background:#fff}
.due-item.today .due-tag{color:var(--blue);border-color:#93c5fd;background:#fff}
.due-item.soon .due-tag{color:var(--amber);border-color:#fcd34d;background:#fff}
.due-main{flex:1;min-width:0}
.due-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-sub{font-size:12px;color:var(--ink2);margin-top:1px}
.due-item.overdue .due-title{color:var(--red)}
.due-btn{flex-shrink:0;background:var(--blue);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;min-height:36px}
.due-empty{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 10px;color:var(--ink2);font-size:13px}
.due-empty svg{opacity:.5}

/* ===== Tab 导航 ===== */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);min-height:44px}
.tab.active{background:var(--blue);color:#fff}
.tab svg{width:17px;height:17px;flex-shrink:0}

/* ===== 区块 ===== */
.sec{display:none}
.sec.active{display:block}

/* 工具条 */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search-box svg{width:16px;height:16px;color:var(--ink3);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;background:none;padding:12px 0;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;font-size:14px;font-weight:600;padding:12px 16px;min-height:44px;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-danger-ghost{background:var(--card);border:1px solid #fecaca;color:var(--red)}
.btn-sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}

/* 分类 chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);min-height:38px;display:flex;align-items:center;gap:5px}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11px}
.chip.active .n{background:rgba(255,255,255,.25)}

/* 原则卡片 */
.p-list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.p-list{grid-template-columns:1fr 1fr}}
.p-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;cursor:pointer;transition:box-shadow .15s,transform .1s;position:relative}
.p-card:active{transform:scale(.99)}
.p-card .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.p-cat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue);flex-shrink:0}
.p-title{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-fav{flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.p-fav.on{color:#f59e0b}
.p-fav svg{width:18px;height:18px}
.p-point{font-size:13px;color:var(--ink2);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.p-cycle{display:flex;align-items:center;gap:4px;background:var(--bg);padding:3px 8px;border-radius:6px;color:var(--ink2)}
.p-cycle svg{width:13px;height:13px}
.p-status{margin-left:auto;font-size:12px;font-weight:600}
.p-status.done{color:var(--green)}
.p-status.due{color:var(--red)}
.p-status.none{color:var(--ink3)}
.p-card .ops{position:absolute;right:10px;bottom:10px;display:none}
.p-card:hover .ops{display:flex;gap:4px}

/* ===== 审视区 ===== */
.rv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.rv-head h2{font-size:16px;font-weight:700}
.rv-form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.rv-form label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.rv-form .fld{margin-bottom:14px}
.rv-form select,.rv-form textarea,.rv-form input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff}
.rv-form select:focus,.rv-form textarea:focus,.rv-form input:focus{border-color:var(--blue)}
.rv-form textarea{min-height:72px;resize:vertical}
.rv-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.rv-form .row2{grid-template-columns:1fr}}
.stars{display:flex;gap:6px}
.star{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#d1d5db;transition:transform .1s}
.star svg{width:30px;height:30px}
.star.on{color:#f59e0b}
.star:active{transform:scale(.85)}
.verdicts{display:flex;gap:8px;flex-wrap:wrap}
.verdict{flex:1;min-width:90px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;background:#fff}
.verdict.active-keep{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.verdict.active-part{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.verdict.active-vio{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.verdict svg{width:15px;height:15px}

/* 审视历史 */
.rv-list{display:grid;gap:10px}
.rv-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.rv-item .r1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rv-item .r1 .t{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-item .r1 .date{font-size:12px;color:var(--ink3);flex-shrink:0}
.rv-item .r2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rv-score{display:flex;gap:2px;color:#f59e0b}
.rv-score svg{width:13px;height:13px}
.rv-verdict{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.rv-verdict.keep{background:var(--green-bg);color:var(--green)}
.rv-verdict.part{background:var(--amber-bg);color:var(--amber)}
.rv-verdict.vio{background:var(--red-bg);color:var(--red)}
.rv-item .practice{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rv-item .reflect{font-size:12px;color:var(--ink2)}
.goal-tag{font-size:11px;font-weight:700;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;padding:2px 8px;border-radius:6px;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.rv-empty{text-align:center;color:var(--ink3);padding:40px 0;font-size:14px}

/* ===== 原则日志 ===== */
.log-list{display:grid;gap:10px}
.log-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.log-item .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.log-item .r1 .date{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:2px 8px;border-radius:6px;flex-shrink:0}
.log-item .r1 .pr{font-size:14px;font-weight:700;flex:1;min-width:0}
.log-item .r1 .score{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);flex-shrink:0}
.log-item .r1 .score svg{width:14px;height:14px;color:#f59e0b}
.log-item .scene{font-size:13px;color:var(--ink);margin-bottom:6px}
.log-item .scene b{color:var(--ink2);font-weight:600}
.log-item .act{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.log-item .refl{font-size:12px;color:var(--ink2)}
.log-del{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink3);border-radius:7px;flex-shrink:0}
.log-del:active{background:var(--red-bg);color:var(--red)}
.log-del svg{width:15px;height:15px}

/* ===== 目标进度 ===== */
.goal-list{display:grid;gap:12px}
.goal-item{display:flex;align-items:center;gap:12px}
.goal-item .g-nm{width:64px;font-size:13px;font-weight:700;flex-shrink:0;text-align:left}
.goal-item .g-bar{flex:1;height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.goal-item .g-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .4s}
.goal-item .g-pct{width:44px;font-size:12px;font-weight:700;text-align:right;flex-shrink:0;color:var(--ink2)}
.goal-empty{font-size:13px;color:var(--ink3);text-align:center;padding:12px 0}

/* ===== 统计 ===== */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:640px){.stat-cards{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat-card .num{font-size:26px;font-weight:800;line-height:1.2}
.stat-card .lb{font-size:12px;color:var(--ink2);margin-top:2px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chart-card h3 svg{width:16px;height:16px;color:var(--blue)}
.chart-wrap{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.legend-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.rank-list{display:grid;gap:8px}
.rank-item{display:flex;align-items:center;gap:10px;font-size:13px}
.rank-item .rk{width:20px;height:20px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);flex-shrink:0}
.rank-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-item .bar-bg{flex:1.4;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.rank-item .bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.rank-item .v{font-size:12px;font-weight:700;width:34px;text-align:right;flex-shrink:0}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s}
@media(min-width:640px){.mask{align-items:center}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;animation:slideUp .2s}
@media(min-width:640px){.modal{border-radius:18px}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:700;flex:1}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border-radius:9px}
.modal-close:active{background:var(--bg)}
.modal-body{padding:14px 18px 20px}
.modal-body .fld{margin-bottom:14px}
.modal-body label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.modal-body input[type=text],.modal-body select,.modal-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{border-color:var(--blue)}
.modal-body textarea{min-height:88px;resize:vertical}
.modal-foot{display:flex;gap:10px;padding:0 18px 20px}
.modal-foot .btn{flex:1}
.p-detail{font-size:14px;color:var(--ink)}
.p-detail .sec2{margin-bottom:14px}
.p-detail .sec2 h4{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.p-detail .content{background:var(--bg);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}

/* 提示 toast */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:200;animation:fadeIn .2s;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* 底部导航（移动端） */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav .bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 4px;font-size:11px;font-weight:600;color:var(--ink3);min-height:52px}
.bottom-nav .bn-tab.active{color:var(--blue)}
.bottom-nav .bn-tab svg{width:21px;height:21px}
@media(min-width:768px){.bottom-nav{display:none}}

/* 空状态 */
.empty-state{text-align:center;color:var(--ink3);padding:48px 0;font-size:14px}
.empty-state svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="hd-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="hd-title">
      <h1>我的原则</h1>
      <p>源于《原则》· 定期审视 · 发现真相</p>
    </div>
    <div class="sync-pill" id="syncPill"><span class="sync-dot" id="syncDot"></span><span id="syncText">加载中</span></div>
  </div>
</header>

<main>
  <!-- 今天要处理 -->
  <section class="due-card" id="dueCard">
    <div class="due-head">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      今天要处理
      <span class="badge" id="dueBadge">0</span>
    </div>
    <div class="due-list" id="dueList"></div>
  </section>

  <!-- Tab 导航 -->
  <nav class="tabs">
    <button class="tab active" data-tab="lib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      原则库
    </button>
    <button class="tab" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      定期审视
    </button>
    <button class="tab" data-tab="logs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      原则日志
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
      数据统计
    </button>
  </nav>

  <!-- 原则库 -->

var DB_PRINCIPLES = "ufRFN2Guko6FLJxL4pblZD"; // 原则库

var LS_CACHE      = "wb_principles_cache_v1"; // 本地离线缓存
var CATS = ["生活原则","工作原则","学习原则","理财原则","思维模型","误判心理学","人生策略"];
var CYCLE_DAYS = {"每周":7,"每两周":14,"每月":30,"每季度":90};
var CAT_COLORS = {
  "生活原则":"#2563eb","工作原则":"#7c3aed","学习原则":"#059669",

// ============ 状态 ============
var state = {
  principles: [],   // 原则列表

  keyword: ""
};

// ============ 工具函数 ============
function $(id){ return document.getElementById(id); }
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayStr(){
  var d=new Date(); var m=String(d.getMonth()+1).padStart(2,"0"); var dd=String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+dd;
}
function addDays(dateStr, days){
  var d=new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+days);
  var m=String(d.getMonth()+1).padStart(2,"0"); var dd=String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+dd;
}
function fmtDate(dateStr){
  if(!dateStr) return "";
  var s=String(dateStr).slice(0,10);
  var parts=s.split("-");
  if(parts.length===3) return parts[1]+"月"+parts[2]+"日";
  return s;
}
function getVal(row, key){ return (row&&row[key]!==undefined&&row[key]!==null)?row[key]:""; }
function toast(msg){
  var t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){t.remove();},320); }, 2200);
}
function uid(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function cycleDays(p){
  var c=getVal(p,"审视周期");
  return CYCLE_DAYS[c]||30;
}

// ============ 数据层（SDK 优先，localStorage 兜底） ============
function getSDK(){
  try{
    if(window.__SMART_PAGE__ && window.__SMART_PAGE__.database) return window.__SMART_PAGE__.database;
  }catch(e){}
  return null;
}
function saveCache(){
  try{
    localStorage.setItem(LS_CACHE, JSON.stringify({p:state.principles, r:state.reviews, g:state.goals, l:state.logs, t:Date.now()}));
  }catch(e){}
}
function loadCache(){
  try{
    var raw=localStorage.getItem(LS_CACHE);
    if(!raw) return false;
    var d=JSON.parse(raw);
    if(d&&d.p) state.principles=d.p;
    if(d&&d.r) state.reviews=d.r;
    if(d&&d.g) state.goals=d.g;
    if(d&&d.l) state.logs=d.l;
    return true;
  }catch(e){ return false; }
}
// 在线加载全部数据（分页拉取）
function queryAll(db, databaseId){
  return new Promise(function(resolve,reject){
    var all=[]; var cursor=null;
    function page(){
      var params={databaseId:databaseId, pageSize:100};
      if(cursor) params.startCursor=cursor;
      db.query(params).then(function(res){
        var rows=(res&&res.results)||[];
        for(var i=0;i<rows.length;i++) all.push(rows[i]);
        if(res&&res.hasMore&&res.nextCursor){ cursor=res.nextCursor; page(); }
        else resolve(all);
      }).catch(reject);
    }
    page();
  });
}
// 加载数据：先在线，失败则用本地缓存
function loadData(){
  return new Promise(function(resolve){
    var sdk=getSDK();
    if(!sdk){
      state.online=false;
      if(!loadCache()) seedLocal();
      resolve(); return;
    }
    state.syncing=true; setSyncUI();
    Promise.all([
      queryAll(sdk, DB_PRINCIPLES), queryAll(sdk, DB_REVIEWS),
      queryAll(sdk, DB_GOALS), queryAll(sdk, DB_LOGS)
    ])
      .then(function(res){
        state.principles=res[0]; state.reviews=res[1];
        state.goals=res[2]; state.logs=res[3];
        state.online=true;
        if(!state.principles.length){
          // 首次使用：把种子数据种入资料库
          return seedToBackend().then(function(){
            return Promise.all([
              queryAll(sdk, DB_PRINCIPLES), queryAll(sdk, DB_REVIEWS),
              queryAll(sdk, DB_GOALS), queryAll(sdk, DB_LOGS)
            ]);
          }).then(function(res2){
            state.principles=res2[0]; state.reviews=res2[1];
            state.goals=res2[2]; state.logs=res2[3];
          });
        }
        return Promise.resolve();
      })
      .then(function(){
        saveCache();
        state.syncing=false; setSyncUI();
        resolve();
      })
      .catch(function(){
        state.online=false;
        if(!loadCache()) seedLocal();
        state.syncing=false; setSyncUI();
        resolve();
      });
  });
}
// 在线写库
function sdkAdd(dbId, props){ return getSDK().addRecord({databaseId:dbId, properties:props}); }
function sdkUpdate(dbId, rid, props){ return getSDK().updateRecord({databaseId:dbId, recordId:rid, properties:props}); }
function sdkDelete(dbId, rid){ return getSDK().deleteRecord({databaseId:dbId, recordId:rid}); }

// 保存原则（新增或更新）
function savePrincipleToBackend(p){
  var props={
    "分类":{"select":getVal(p,"分类")},
    "标题":{"text":getVal(p,"标题")},
    "内容":{"text":getVal(p,"内容")},
    "要点":{"text":getVal(p,"要点")},
    "审视周期":{"select":getVal(p,"审视周期")||"每月"},
    "状态":{"select":getVal(p,"状态")||"进行中"},
    "收藏":{"checkbox":!!p["收藏"]},
    "创建日期":{"date":getVal(p,"创建日期")||todayStr()}
  };
  if(!state.online){
    if(p._id){ var i=findP(p._id); if(i>=0) state.principles[i]=p; else state.principles.push(p); }
    else { p._id=uid(); p["创建日期"]=getVal(p,"创建日期")||todayStr(); state.principles.push(p); }
    saveCache(); return Promise.resolve(true);
  }
  if(p._id){
    return sdkUpdate(DB_PRINCIPLES, p._id, props).then(function(){ return true; });
  }else{
    return sdkAdd(DB_PRINCIPLES, props).then(function(){ return true; });
  }
}
// 删除原则（在线删除 + 本地同步移除）
function deletePrincipleFromBackend(p){
  if(state.online && p._id){
    return sdkDelete(DB_PRINCIPLES, p._id).then(function(){ return true; }).catch(function(){ return false; });
  }
  return Promise.resolve(true);
}
// 保存审视记录
function saveReviewToBackend(rv){
  var props={
    "原则标题":{"text":getVal(rv,"原则标题")},
    "审视日期":{"date":getVal(rv,"审视日期")||todayStr()},
    "评分":{"number":Number(getVal(rv,"评分"))||3},
    "判定":{"select":getVal(rv,"判定")||"部分坚持"},
    "践行情况":{"text":getVal(rv,"践行情况")},
    "反思":{"text":getVal(rv,"反思")},
    "备注":{"text":getVal(rv,"备注")},
    "关联目标":{"text":getVal(rv,"关联目标")}
  };
  if(!state.online){
    if(rv._id){ for(var i=0;i<state.reviews.length;i++){ if(state.reviews[i]._id===rv._id){ state.reviews[i]=rv; break; } } }
    else { rv._id=uid(); state.reviews.push(rv); }
    saveCache(); return Promise.resolve(true);
  }
  if(rv._id){
    return sdkUpdate(DB_REVIEWS, rv._id, props).then(function(){ return true; });
  }else{
    return sdkAdd(DB_REVIEWS, props).then(function(){ return true; });
  }
}
function deleteReviewFromBackend(rv){
  if(state.online && rv._id){
    return sdkDelete(DB_REVIEWS, rv._id).then(function(){ return true; }).catch(function(){ return false; });
  }
  return Promise.resolve(true);
}
function findP(id){ for(var i=0;i<state.principles.length;i++){ if(state.principles[i]._id===id) return i; } return -1; }
function findPByTitle(t){ for(var i=0;i<state.principles.length;i++){ if(getVal(state.principles[i],"标题")===t) return state.principles[i]; } return null; }
function reviewsOfTitle(t){
  return state.reviews.filter(function(r){ return getVal(r,"原则标题")===t; })
    .sort(function(a,b){ return String(getVal(b,"审视日期")).localeCompare(String(getVal(a,"审视日期"))); });
}
// 最近审视日期 + 下次应审视日期
function lastReviewDate(p){
  var rs=reviewsOfTitle(getVal(p,"标题"));
  if(rs.length) return getVal(rs[0],"审视日期");
  return null;
}
function nextDueDate(p){
  var last=lastReviewDate(p);
  if(!last) return null;
  return addDays(last, cycleDays(p));
}
// 审视状态：due=逾期 today=今日 soon=临近 ok=正常 none=未审视
function dueStatus(p){
  var due=nextDueDate(p);
  if(!due) return {s:"none"};
  var today=todayStr();
  if(due<today) return {s:"due", due:due};
  if(due===today) return {s:"today", due:due};
  if(due<=addDays(today,2)) return {s:"soon", due:due};
  return {s:"ok", due:due};
}

function setSyncUI(){
  var dot=$("syncDot"), txt=$("syncText");
  if(state.syncing){ dot.className="sync-dot sync"; txt.textContent="同步中"; }
  else if(state.online){ dot.className="sync-dot ok"; txt.textContent="已同步"; }
  else{ dot.className="sync-dot off"; txt.textContent="离线模式"; }
}
function refreshFromBackend(){
  var sdk=getSDK();
  if(!sdk){ state.online=false; setSyncUI(); renderAll(); return Promise.resolve(); }
  state.syncing=true; setSyncUI();
  return Promise.all([
    queryAll(sdk, DB_PRINCIPLES), queryAll(sdk, DB_REVIEWS),
    queryAll(sdk, DB_GOALS), queryAll(sdk, DB_LOGS)
  ])
    .then(function(res){
      state.principles=res[0]; state.reviews=res[1];
      state.goals=res[2]; state.logs=res[3];
      state.online=true; saveCache();
      state.syncing=false; setSyncUI(); renderAll();
    })
    .catch(function(){
      state.online=false; state.syncing=false; setSyncUI(); renderAll();
      toast("同步失败，已切换到本地缓存");
    });
}

function renderDue(){
  var items=[];
  state.principles.forEach(function(p){
    if(getVal(p,"状态")==="已归档") return;
    var st=dueStatus(p);
    if(st.s==="due"||st.s==="today"||st.s==="soon"){
      items.push({p:p, st:st});
    }
  });
  items.sort(function(a,b){
    var order={due:0,today:1,soon:2};
    return order[a.st.s]-order[b.st.s];
  });
  $("dueBadge").textContent=items.length;
  var html="";
  if(!items.length){
    html='<div class="due-empty">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'+
      '太棒了，当前没有需要处理的原则</div>';

    items.forEach(function(it){
      var st=it.st, p=it.p;
      var cls="due-item "+st.s;
      var tag= st.s==="due"?"逾期"+dayDiff(st.due): st.s==="today"?"今日应审视":(""+dayDiff(st.due)+"天后");
      var sub= st.s==="due" ? ("本应 "+fmtDate(st.due)+" 审视，快补上") :
               st.s==="today" ? "按周期今天该审视了" : ("下次审视 "+fmtDate(st.due));
      html+='<div class="'+cls+'">'+
        '<span class="due-tag">'+tag+'</span>'+
        '<div class="due-main"><div class="due-title">'+esc(getVal(p,"标题"))+'</div>'+
        '<div class="due-sub">'+esc(sub)+' · '+esc(getVal(p,"分类"))+'</div></div>'+

      '</div>';

  }
  $("dueList").innerHTML=html;

function renderStats(){
  var total=state.principles.length;
  var reviewed=0; state.principles.forEach(function(p){ if(lastReviewDate(p)) reviewed++; });
  var keepCount=0, rvCount=state.reviews.length;
  state.reviews.forEach(function(r){ if(getVal(r,"判定")==="坚持") keepCount++; });
  var keepRate= rvCount? Math.round(keepCount/rvCount*100):0;
  var dueCount=state.principles.filter(function(p){ var s=dueStatus(p); return s.s==="due"||s.s==="today"; }).length;

  $("statCards").innerHTML=
    '<div class="stat-card"><div class="num" style="color:#2563eb">'+total+'</div><div class="lb">原则总数</div></div>'+
    '<div class="stat-card"><div class="num" style="color:#16a34a">'+reviewed+'</div><div class="lb">已审视原则</div></div>'+
    '<div class="stat-card"><div class="num" style="color:#d97706">'+dueCount+'</div><div class="lb">待处理（逾期/今日）</div></div>'+
    '<div class="stat-card"><div class="num" style="color:#7c3aed">'+keepRate+'%</div><div class="lb">坚持率（'+keepCount+'/'+rvCount+'次）</div></div>';

  // 目标进度看板
  renderGoalList();

  // 分类饼图（环形）
  var catCounts={};
  CATS.forEach(function(c){ catCounts[c]=0; });
  state.principles.forEach(function(p){ var c=getVal(p,"分类"); if(catCounts[c]!==undefined) catCounts[c]++; });
  var r=52, cx=70, cy=70, circ=2*Math.PI*r;
  var pieHtml='<svg width="140" height="140" viewBox="0 0 140 140" style="display:block;margin:0 auto">';
  var offset=0, totalC=total||1, first=true;
  var legend='<div class="legend">';
  CATS.forEach(function(c){
    var n=catCounts[c]; if(!n) return;
    var frac=n/totalC;
    var dash=frac*circ;
    pieHtml+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(CAT_COLORS[c]||"#ccc")+'" stroke-width="16" stroke-dasharray="'+(dash-1.5)+' '+(circ-dash+1.5)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    offset+=dash;
    legend+='<span class="legend-item"><span class="sw" style="background:'+(CAT_COLORS[c]||"#ccc")+'"></span>'+esc(c)+' '+n+'</span>';
  });
  legend+='</div>';
  pieHtml+='<text x="70" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2937">'+total+'</text>'+
           '<text x="70" y="84" text-anchor="middle" font-size="11" fill="#6b7280">条原则</text></svg>';
  $("catChart").innerHTML=pieHtml+legend;

  // 评分趋势折线图（最近12次）
  var sorted=state.reviews.slice().sort(function(a,b){ return String(getVal(a,"审视日期")).localeCompare(String(getVal(b,"审视日期"))); });
  var last12=sorted.slice(-12);
  var trendHtml="";
  if(last12.length<2){
    trendHtml='<div class="empty-state" style="padding:24px 0">至少需要 2 条审视记录才能生成趋势图</div>';
  }else{
    var W=520,H=150,padL=28,padB=22,padT=12;
    var min=1,max=5;
    var xs=[],ys=[];
    for(var i=0;i<last12.length;i++){
      xs.push(padL+i*(W-padL-16)/(last12.length-1));
      ys.push(padT+(max-Number(getVal(last12[i],"评分")||3))/(max-min)*(H-padT-padB));
    }
    var lines='';
    for(var g=1;g<=5;g++){
      var gy=padT+(max-g)/(max-min)*(H-padT-padB);
      lines+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-16)+'" y2="'+gy+'" stroke="#eef1f6" stroke-width="1"/>';
      lines+='<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="10" fill="#9ca3af">'+g+'</text>';
    }
    var poly='';
    for(var i2=0;i2<xs.length;i2++){ poly+=(i2? ' L':'M')+xs[i2].toFixed(1)+','+ys[i2].toFixed(1); }
    var area=poly+' L'+xs[xs.length-1].toFixed(1)+','+(H-padB)+' L'+xs[0].toFixed(1)+','+(H-padB)+' Z';
    var dots='';
    for(var i3=0;i3<xs.length;i3++){
      dots+='<circle cx="'+xs[i3].toFixed(1)+'" cy="'+ys[i3].toFixed(1)+'" r="3.4" fill="#2563eb"><title>'+fmtDate(getVal(last12[i3],"审视日期"))+' 评分'+getVal(last12[i3],"评分")+'</title></circle>';
    }
    trendHtml='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="min-width:420px">'+
      '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity=".22"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>'+
      lines+
      '<path d="'+area+'" fill="url(#tg)"/>'+
      '<path d="'+poly+'" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      dots+'</svg>';
  }
  $("trendChart").innerHTML=trendHtml;

  // 审视次数排行
  var cnt={};
  state.reviews.forEach(function(r){ var t=getVal(r,"原则标题"); cnt[t]=(cnt[t]||0)+1; });
  var rank=Object.keys(cnt).map(function(t){ return {t:t,n:cnt[t]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,10);
  var maxN=rank.length? rank[0].n:1;
  var rankHtml="";
  if(!rank.length){
    rankHtml='<div class="empty-state" style="padding:20px 0">暂无审视数据</div>';
  }else{
    rank.forEach(function(it,i){
      rankHtml+='<div class="rank-item"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(it.t)+'</span>'+
        '<div class="bar-bg"><div class="bar" style="width:'+(it.n/maxN*100)+'%"></div></div><span class="v">'+it.n+'次</span></div>';
    });
  }
  $("rankList").innerHTML=rankHtml;
}

function submitPrinciple(oldTitle){
  var title=$("fTitle").value.trim();
  if(!title){ toast("请填写标题"); return; }
  var p= oldTitle? findPByTitle(oldTitle) : null;
  var obj= p? Object.assign({},p) : {_id: p?p._id:null};
  obj["分类"]=$("fCat").value;
  obj["标题"]=title;
  obj["要点"]=$("fPoint").value.trim();
  obj["内容"]=$("fContent").value.trim();
  obj["审视周期"]=$("fCycle").value;
  obj["状态"]=$("fStatus").value;
  obj["收藏"]=$("fFav").checked;
  if(!obj["创建日期"]) obj["创建日期"]=todayStr();
  if(p) obj._id=p._id;
  var isNew=!p;
  savePrincipleToBackend(obj).then(function(){
    closeModal();
    return refreshFromBackend();
  }).then(function(){
    toast(isNew?"已新增原则":"已保存修改");
  }).catch(function(){ toast("保存失败，请重试"); });
}
function deletePrinciple(title){
  var p=findPByTitle(title);

    deletePrincipleFromBackend(p).then(function(){
      state.principles=state.principles.filter(function(x){ return x._id!==p._id; });
      saveCache();
      closeModal();
      return refreshFromBackend();
    }).then(function(){ toast("已删除"); });

}

function submitReview(){
  var title=$("rvTitle").value;
  var date=$("rvDate").value||todayStr();
  var score=window._rvScore||3;
  var verdict=window._rvVerdict||"部分坚持";
  var practice=$("rvPractice").value.trim();
  var reflect=$("rvReflect").value.trim();
  var goal=$("rvGoal").value;
  var goalProgress=$("rvGoalProgress").value;
  if(!title){ toast("请选择原则"); return; }
  var rv={_id:uid(), "原则标题":title, "审视日期":date, "评分":score, "判定":verdict, "践行情况":practice, "反思":reflect, "备注":"", "关联目标":goal};
  // 若填了目标进度，同步更新目标
  var goalPromise=Promise.resolve();
  if(goal && goalProgress!==""){
    var g=state.goals.filter(function(x){ return getVal(x,"目标名称")===goal; })[0];
    if(g){
      goalPromise=updateGoalProgress(g, Number(goalProgress)||0);
    }
  }
  goalPromise.then(function(){
    return saveReviewToBackend(rv);
  }).then(function(){
    closeModal();
    return refreshFromBackend();
  }).then(function(){ toast("审视已记录"+(goal?"，目标已同步":"")); });
}
// 更新目标进度（本地+在线）
function updateGoalProgress(g, progress){
  var obj=Object.assign({},g);
  obj["当前进度"]=Math.max(0,Math.min(100,progress));
  if(!state.online){
    for(var i=0;i<state.goals.length;i++){ if(state.goals[i]._id===g._id){ state.goals[i]=obj; break; } }
    saveCache(); return Promise.resolve(true);
  }
  var props={
    "目标名称":{"text":getVal(obj,"目标名称")},
    "分类":{"select":getVal(obj,"分类")},
    "目标描述":{"text":getVal(obj,"目标描述")},
    "当前进度":{"number":obj["当前进度"]},
    "目标期限":{"date":getVal(obj,"目标期限")||"2026-12-31"},
    "状态":{"select":getVal(obj,"状态")||"进行中"},
    "备注":{"text":getVal(obj,"备注")}
  };
  return sdkUpdate(DB_GOALS, obj._id, props).then(function(){ return true; });
}

    p=sdkAdd(DB_LOGS, props);
  }else{
    state.logs.push(lg); saveCache(); p=Promise.resolve(true);
  }
  p.then(function(){
    closeModal();
    return refreshFromBackend();
  }).then(function(){ toast("已记录，保持下去！"); });
}

// ============ 渲染入口 ============
function renderAll(){
  renderDue();
  if(state.tab==="lib") renderPrinciples();
  if(state.tab==="review") renderReviews();
  if(state.tab==="logs") renderLogs();
  if(state.tab==="stats") renderStats();
}

// ============ 初始化 ============
loadData().then(function(){
  setSyncUI();
  renderAll();
  if(!state.online) toast("资料库暂不可用，当前为本地存储模式");
});
</script>
</body>
</html>
