<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GoalTracker · 投资研究</title>
<meta name="description" content="投资研究独立应用：待击球台账、公司估值、财报跟踪、行业研究、宏观经济，独立数据文件 invest-data.json，本地存储、离线可用。">
<meta name="theme-color" content="#0ea97b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GoalTracker 投资研究">
<link rel="manifest" href="manifest.json" id="manifest-link">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- 主题需在首帧前应用，避免深色用户看到闪白（与目标入口共享同一偏好键，深色一致） -->
<script>
(function(){
  try{
    var t = localStorage.getItem('goalTracker.theme');
    var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark){
      document.documentElement.classList.add('dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if(m) m.setAttribute('content', '#0d1117');
    }
    // file:// 下浏览器会因 CORS 拒绝抓取 manifest 并反复报错；PWA 能力本就只在 http(s) 下可用，直接摘掉
    if(location.protocol === 'file:'){
      var ml = document.getElementById('manifest-link');
      if(ml) ml.parentNode.removeChild(ml);
    }
  }catch(e){}
})();
</script>
<!-- KaTeX 已改为按需懒加载：仅当页面出现公式时才动态引入，加快首屏加载 -->
</head>
<body>
<!-- 移动端顶栏（<720px 显示） -->
<div class="mobile-topbar">
  <button class="hamburger" id="m-menu" aria-label="打开菜单">☰</button>
  <div class="m-brand"><div class="brand-logo">📈</div><div class="m-title">投资研究</div></div>
</div>
<div class="mobile-backdrop" id="m-backdrop"></div>
<aside id="sidebar">
  <div class="brand">
    <div class="brand-logo">📈</div>
    <div><div class="brand-name">投资研究</div><div class="brand-sub">INVEST</div></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <div id="sync-box"></div>
    <button class="btn ghost sm" onclick="location.href='index.html'" title="切换到目标追踪应用（减脂/求职/阅读/副业等）">🎯 目标追踪 →</button>
    <button class="btn ghost sm" data-action="theme.toggle" title="切换深色 / 浅色主题">🌙 深色模式</button>
    <button class="btn ghost sm" data-action="data.export" title="导出完整数据备份：invest-data.json（含全部投资模块数据，用于换设备/同步盘）">⬇ 导出备份</button>
    <button class="btn ghost sm" data-action="data.import" title="导入数据：invest-data.json（会用导入内容覆盖当前数据，建议先导出备份）">⬆ 导入数据</button>
    <button class="btn ghost sm" data-action="data.remoteCheck" title="比对同步盘里的 invest-data.json 与浏览器内的数据，若磁盘更新可一键加载">🔄 检查同步盘</button>
    <div class="side-note">数据文件名：invest-data.json<br>IndexedDB 本地存储 · 导出 JSON 同步</div>
  </div>
</aside>
<main id="main"></main>
<!-- 同步盘更新提示条（core.js 的 checkRemoteData 填充；初始 hidden） -->
<div id="remote-bar" class="remote-bar" hidden></div>
<div id="modal-root"></div>
<input type="file" id="import-file" accept="application/json" hidden>
<!-- 内核：先注入投资命名空间（库名/存储键/导出文件名/默认视图），再加载 core.js -->
<script>window.GT_APP = { ns:'invest', db:'investDB', file:'invest-data.json', def:'invest', self:'invest.html', peer:'index.html', peerLabel:'目标追踪', peerIco:'🎯', navTitle:'投资研究', docTitle:'投资研究 · GoalTracker' };</script>
<script>console.log('%c[GoalTracker · 投资研究] 独立应用版','background:#0ea97b;color:#fff;padding:2px 8px;border-radius:4px;font-weight:bold');</script>
<script src="core.js"></script>
<!-- 汉字转拼音库（公司搜索的拼音模糊匹配用；UMD → window.pinyinPro，加载失败时自动退化为原文匹配） -->
<script src="lib/pinyin-pro.js"></script>
<!-- 投资模块（投资追踪组） -->
<script src="modules/invest-home.js"></script>
<!-- 待击球台账（现价/估值数据复用估值模块） -->
<script src="modules/swing.js"></script>
<!-- 估值纯函数（被 valuation.js / invest-home 复用），须在 valuation.js 之前加载 -->
<script src="modules/val-core.js"></script>
<script src="modules/valuation.js"></script>
<!-- 财报跟踪 -->
<script src="modules/earnings.js"></script>
<!-- 行业研究 -->
<script src="modules/industries.js"></script>
<!-- 宏观经济 -->
<script src="modules/macro.js"></script>
<!-- 移动端交互 + Service Worker 注册 -->
<script src="mobile.js"></script>
<!-- 启动入口 -->
<script src="boot.js"></script>
</body>
</html>
