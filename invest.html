<!-- 主题需在首帧前应用，避免深色用户看到闪白（与目标入口共享同一偏好键，深色一致） -->
<script>
(function(){
  try{
    var t = localStorage.getItem('goalTracker.theme');
    var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark){
      document.documentElement.classList.add('dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if(m) m.setAttribute('content', '#0d1117');
    }
    // file:// 下浏览器会因 CORS 拒绝抓取 manifest 并反复报错；PWA 能力本就只在 http(s) 下可用，直接摘掉
    if(location.protocol === 'file:'){
      var ml = document.getElementById('manifest-link');
      if(ml) ml.parentNode.removeChild(ml);
    }
  }catch(e){}
})();
</script>
<!-- KaTeX 已改为按需懒加载：仅当页面出现公式时才动态引入，加快首屏加载 -->

<!-- 投资模块（投资追踪组）—— 侧边栏顺序 = 注册顺序，按研究数据流排列：
     总览 → 宏观环境 → 行业研究(选赛道) → 财报跟踪(筛公司) → 公司估值(定价) → 待击球(执行) → 数据导入(数据支撑) -->
<!-- 懒加载器：大模块（macro/industries/swing，合计 ~340KB）首次进入视图时才注入脚本；
     占位模块先注册占住侧边栏位置与 hash 路由，真模块加载后由 core.js 原位替换并补 ensure(DB) -->
<script>
window.GT_LAZY = (function(){
  const SRC = { macro:'modules/macro.js', industries:'modules/industries.js', swing:'modules/swing.js' };
  const pending = {};
  function load(view){
    const src = SRC[view];
    if(!src) return Promise.resolve();
    if(!pending[src]){
      pending[src] = new Promise(function(res, rej){
        const s = document.createElement('script');
        s.src = src;
        s.onload = function(){
          // 真模块已注册：补跑 ensure 用真实 seed 初始化 DB[view]（占位模块无 seed，不参与）
          try { if(typeof DB !== 'undefined' && DB) ensure(DB); } catch(e){ console.error('懒加载 ensure 失败(' + view + '):', e); }
          res();
        };
        s.onerror = function(){ delete pending[src]; rej(new Error('脚本加载失败：' + src)); };
        document.head.appendChild(s);
      });
    }
    return pending[src].then(function(){ if(state.view === view) render(); });
  }
  return { load: load };
})();
</script>
<script src="modules/invest-home.js"></script>
